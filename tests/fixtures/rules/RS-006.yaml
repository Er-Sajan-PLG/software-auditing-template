rule: RS-006
negative:
  files:
    .github/workflows/audit.yml: |
      name: Audit
      jobs:
        audit:
          steps:
            - run: cargo audit
positive:
  files:
    .github/workflows/audit.yml: |
      name: CI
      jobs:
        build:
          steps:
            - run: cargo build
  expect: MISSING
