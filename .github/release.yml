# Categorised, auto-generated release notes.
# Without this, `gh release create` produces an unsorted list of commit titles,
# which nobody reads. Docs: docs/release-notes (see .github/workflows/release.yml)
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
      - github-actions[bot]

  categories:
    - title: 🚨 Breaking changes
      labels:
        - breaking-change

    - title: ✨ New rules & detectors
      labels:
        - rules
        - detection

    - title: 🎉 Enhancements
      labels:
        - enhancement
        - feature

    - title: 🐛 Fixes
      labels:
        - bug
        - false-positive

    - title: 📚 Documentation
      labels:
        - documentation

    - title: 🧹 Housekeeping
      labels:
        - dependencies
        - ci
        - refactor
        - test

    - title: 🔀 Other changes
      labels:
        - '*'
