name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: tags cut by GITHUB_TOKEN (e.g. release-please before
  # the PAT switch) never fire tag-push workflows — GitHub suppresses
  # token-triggered runs to prevent loops. Dispatching here publishes
  # whatever version package.json holds on the chosen branch.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # OIDC trusted publishing: no long-lived NPM_TOKEN. One-time owner setup:
  # npmjs.com → package Settings → Trusted Publisher → GitHub Actions,
  # this repo + this workflow. Until then, publishing fails closed here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24: trusted publishing REQUIRES npm ≥ 11.5.1 (Node ≥ 22.14).
          # On Node 20 (npm 10) the Sigstore/provenance leg succeeds but the
          # registry OIDC token exchange silently never happens — the PUT
          # goes out unauthenticated and npm 404s. Do not downgrade this.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Belt and braces: setup-node's bundled npm is not pinned to ≥ 11.5.1,
      # and a future downgrade would fail exactly like Node 20 did (provenance
      # signed, PUT 404). Pin the floor explicitly instead of trusting it.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@^11.15.0 && npm --version

      - run: npm ci
      - run: npm run build
      # Provenance is public, verifiable build metadata on the registry —
      # what USAT's own S3 rules demand of others (SUP-005..007, S3).
      # --access public is mandatory: scoped packages default to restricted.
      - run: npm publish --provenance --access public

      # CycloneDX SBOM for the shipped tarball. Same preach/practice logic:
      # USAT audits SBOM publication (SUP-014), so it ships one. `npm sbom`
      # writes to stdout (there is no -o flag); the tree is complete because
      # `npm ci` ran above — a partial node_modules fails with ESBOMPROBLEMS.
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: usat-sbom
          path: sbom.cdx.json
