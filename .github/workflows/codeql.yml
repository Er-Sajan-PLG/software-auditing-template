# Static analysis. USAT's own rule SUP-006 asks whether SAST runs in CI, so this
# repo runs it. CodeQL is free for public repositories.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 06:17 UTC Mondays — off the hour, so we are not queued behind everyone else.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}

      # CodeQL Advanced setup is a repository setting (Settings → Code security).
      # If Default setup is enabled instead of Advanced, this step reports the
      # conflict and we do not block a merge on a settings change that cannot be
      # made from a pull request. Everything else in CI stays blocking.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: '/language:${{ matrix.language }}'
