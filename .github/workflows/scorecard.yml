name: Scorecard

# OpenSSF Scorecard: the machine-checkable counterpart to the posture USAT
# claims in docs/standards-mapping.md. Runs the same hygiene checks (branch
# protection, token permissions, pinned deps, SAST presence, license, …)
# from the *platform* side — the API-verified view USAT's file-text rules
# approximate. Results publish to the Security tab and the public dataset.
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 8 1 * *' # monthly drift check (matches self-audit cadence)
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      id-token: write # publish_results (Sigstore-signed, keyless)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
