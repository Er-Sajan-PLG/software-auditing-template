name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the default GITHUB_TOKEN gets read-only unless a job asks for
# more. (Yes, USA checks this on the projects it audits — it applies to itself.)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # tests/e2e.test.ts audits this repo and asserts zero warnings; a
          # shallow (depth-1) checkout looks like a single-commit history, so
          # USA emits a "shallow clone?" warning and the assertion fails.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Vitest
        run: npm run test:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile
        run: npm run build

      - name: Smoke test the CLI
        run: |
          node dist/cli.js version
          node dist/cli.js rules | tail -3
          node dist/cli.js explain SEC-001 | head -5

  rules:
    name: Validate rule packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Every pack loads and every rule parses
        run: |
          node dist/cli.js rules | tail -1 | tee /tmp/rules.txt
          grep -qE '^[0-9]{3,} rule' /tmp/rules.txt || { echo "rule count looks wrong"; exit 1; }

      - name: Detection still works on this repo
        run: |
          node dist/cli.js detect . | grep -q 'maturity:'

  # Docs rot faster than code, and ADRs rot fastest of all (ADR-0001 says so
  # explicitly). These two scripts assert the machine-checkable invariants:
  # the README rule-count floor, USA.md section coverage, and ADR
  # numbering/index completeness. See scripts/check-docs.mjs,
  # scripts/check-adrs.mjs, and ROADMAP.md ("doc sync").
  # Commit messages drive releases (release-please reads them), so they are
  # linted like code. PR-only: master receives squash/rebase merges whose
  # messages GitHub derives from PR titles — lint the PR commits, not merges.
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # SHAs resolve via `gh`, never by interpolating pull-request payload
      # fields into `run:` blocks: SUP-008 forbids event-payload text there
      # (it matches comments too, hence this careful wording), even where
      # the value is server-generated hex. The numeric event number below
      # is outside that rule's pattern by construction.
      - name: Lint commit messages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          BASE_SHA="$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)"
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  hygiene:
    name: Docs & ADR hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # dist/ is required by check-docs (flag references run --help) and
      # gen-cli-docs --check. check-docs used to run before the build and
      # failed with MODULE_NOT_FOUND on both stacked PRs.
      - run: npm run build

      - name: ADR index and numbering
        run: npm run docs:adrs

      - name: Doc governance (facts, links, index, version pins, headings)
        run: npm run docs:check

      - name: CLI reference is generated and committed
        run: npm run docs:cli

      - name: Sample report is generated and committed
        run: npm run docs:sample

  # USA audits supply-chain hygiene on other people's repos, so it runs the
  # same three scanners on itself. These are the checks behind SUP-005..007.
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      # Run the gitleaks binary directly rather than through gitleaks-action:
      # the Action ships its own default config, so the repo's .gitleaks.toml
      # (which allowlists the deliberately vulnerable demo app) is not reliably
      # applied. The binary is MIT; the Action wrapper carries the org licence.
      #
      # This repo must contain credential-shaped strings, so the build is failed
      # by scripts/gitleaks-filter.mjs rather than by gitleaks' own exit code:
      # findings in the demo app, or in the docs that quote it, are expected.
      - name: Secret scan
        run: |
          VERSION=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          set +e
          gitleaks detect --source . --no-banner --redact \
            --report-format json --report-path /tmp/gitleaks.json
          gitleaks_exit=$?
          set -e
          if [ "$gitleaks_exit" -ne 0 ] && [ ! -f /tmp/gitleaks.json ]; then
            echo "gitleaks failed to run (exit $gitleaks_exit) without producing a report"
            exit "$gitleaks_exit"
          fi
          node scripts/gitleaks-filter.mjs /tmp/gitleaks.json

      - name: License scan
        run: npx license-checker --production --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0'
