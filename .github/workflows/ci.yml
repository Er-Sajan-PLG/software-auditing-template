name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the default GITHUB_TOKEN gets read-only unless a job asks for
# more. (Yes, USAT checks this on the projects it audits — it applies to itself.)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Vitest
        run: npm run test:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile
        run: npm run build

      - name: Smoke test the CLI
        run: |
          node dist/cli.js version
          node dist/cli.js rules | tail -3
          node dist/cli.js explain SEC-001 | head -5

  rules:
    name: Validate rule packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Every pack loads and every rule parses
        run: |
          node dist/cli.js rules | tail -1 | tee /tmp/rules.txt
          grep -qE '^[0-9]{3,} rule' /tmp/rules.txt || { echo "rule count looks wrong"; exit 1; }

      - name: Detection still works on this repo
        run: |
          node dist/cli.js detect . | grep -q 'maturity:'

  # USAT audits supply-chain hygiene on other people's repos, so it runs the
  # same three scanners on itself. These are the checks behind SUP-005..007.
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: License scan
        run: npx license-checker --production --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0'
